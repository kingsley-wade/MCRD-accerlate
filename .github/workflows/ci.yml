name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Validate project specs
        run: uv run python scripts/validate_specs.py
      - name: Compile package and scripts
        run: uv run python -m compileall -q src scripts benchmarks
      - name: Build distributions
        run: uv build
